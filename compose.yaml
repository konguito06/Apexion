services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APEXION_CORS_ORIGINS: ${APEXION_CORS_ORIGINS:-http://localhost:8080}
    ports:
      - "8000:8000"
    volumes:
      - fastf1-cache:/app/backend/.cache/fastf1
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  fastf1-cache:
